name: noalloc CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup Deps
      run: sudo apt-get update && sudo apt install -y cmake g++
    - name: Configure
      run: cmake -S . -B cmake-build-debug  -DCMAKE_BUILD_TYPE=Debug
    - name: Build
      run: cmake --build cmake-build-debug
